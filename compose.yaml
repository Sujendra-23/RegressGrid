name: regressgrid
x-worker: &worker
  build:
    context: .
    dockerfile: Dockerfile.worker
  image: regressgrid-worker:local
  environment:
    CONTROL_ADDR: server:9090
    WORKER_TOKEN: ${GRID_WORKER_TOKEN:-local-worker-token}
    WORKER_SLOTS: 2
    BUILD_PARALLELISM: 2
  volumes:
    - demo:/demo:ro
  tmpfs:
    - /work:exec,uid=10001,gid=10001,mode=0750
  depends_on:
    server:
      condition: service_healthy
    seed:
      condition: service_completed_successfully
  restart: unless-stopped
  stop_grace_period: 15s
  mem_limit: 2g
  cpus: 2
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: grid
      POSTGRES_PASSWORD: ${GRID_DB_PASSWORD:-local-database-password}
      POSTGRES_DB: regressgrid
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U grid -d regressgrid"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      API_TOKEN: ${GRID_API_TOKEN:-local-api-token}
      WORKER_TOKEN: ${GRID_WORKER_TOKEN:-local-worker-token}
      DATABASE_URL: postgres://grid:${GRID_DB_PASSWORD:-local-database-password}@postgres:5432/regressgrid
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:${GRID_HTTP_PORT:-8080}:8080"
    volumes:
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/readyz]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  seed:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: regressgrid-worker:local
    entrypoint: [/bin/sh, /scripts/seed.sh]
    volumes:
      - demo:/demo
      - ./examples:/examples:ro
      - ./scripts/seed.sh:/scripts/seed.sh:ro
  worker:
    <<: *worker
  prometheus:
    image: prom/prometheus:v3.3.1
    ports:
      - "127.0.0.1:${GRID_PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [server]
  grafana:
    image: grafana/grafana:11.6.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRID_GRAFANA_PASSWORD:-local-grafana-password}
    ports:
      - "127.0.0.1:${GRID_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboard.json:/var/lib/grafana/dashboards/regressgrid.json:ro
    depends_on: [prometheus]
volumes:
  postgres:
  redis:
  data:
  demo:
